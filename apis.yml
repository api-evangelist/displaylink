aid: displaylink
name: DisplayLink
description: DisplayLink, a brand of Synaptics Incorporated, develops USB-based virtual graphics technology
  that pairs host driver software with a device-side decoder SoC to act as a virtual graphics card. Its
  adaptive-compression technology powers universal docking stations, USB monitors, adapters, and
  multi-display setups over USB-C, USB, and Ethernet, spanning products from the entry-level DL-3000/4000
  series to the quad-display DL-7000 professional series. DisplayLink is a hardware/semiconductor and
  driver-software product line rather than a public web-API provider; its developer surface consists of
  chip SDKs, firmware tooling, and host driver software.
